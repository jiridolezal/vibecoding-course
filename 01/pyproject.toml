[project]
name = "llm-tool-call"
version = "1.0.0"
description = "Minimal LLM tool-calling demo: the model calls a Python function and gets the result back."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jiří Doležal" }]
dependencies = [
    "openai>=2.20.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
llm-tool-call = "llm_tool_call.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
